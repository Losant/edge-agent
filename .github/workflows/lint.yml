name: Linter

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
    - name: Cancel Previous Runs
      # tag 0.13.1
      uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66
      with:
        access_token: ${{ github.token }}
    # tag v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Setup pnpm
      # tag v3.1.2
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
      with:
        require-lockfile: true
        node-version-file: '.node-version'
    - run: pnpm install --frozen-lockfile
    - run: pnpm install:scripts --frozen-lockfile
    - run: pnpm lint
    - run: pnpm scripts:test
    - run: pnpm licenses:check
