name: Build Images

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

concurrency:
  group: build-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [edge, edge-alpine, edge-sle]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
    # tag v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    # tag v4.4.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build image
      # tag v7.5.0
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
      with:
        targets: ${{ matrix.target }}
        set: |
          *.platform=linux/${{ matrix.arch }}
          *.output=type=cacheonly
          *.cache-from=type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
