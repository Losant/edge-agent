name: Build Images

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

concurrency:
  group: build-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build (all targets / amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    # tag v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    # tag v4.4.0
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    # tag v4.4.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build images
      # tag v7.5.0
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
      with:
        targets: edge,edge-alpine,edge-sle
        set: |
          *.output=type=cacheonly
          edge.cache-from=type=gha,scope=edge
          edge.cache-to=type=gha,mode=max,scope=edge
          edge-alpine.cache-from=type=gha,scope=edge-alpine
          edge-alpine.cache-to=type=gha,mode=max,scope=edge-alpine
          edge-sle.cache-from=type=gha,scope=edge-sle
          edge-sle.cache-to=type=gha,mode=max,scope=edge-sle
